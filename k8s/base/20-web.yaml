# ЛР3, крок 4. Сервіс web. Поле replicas у Deployment навмисно відсутнє: кількістю реплік
# керує kubectl scale (кроки 7, 10) або HPA (крок 11); інакше кожне kubectl apply
# повертало б її до значення з маніфесту.
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: studies
data:
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: studies
  DB_USER: studies_app
  DB_POOL_MIN: "2"
  DB_POOL_SIZE: "15"                 # варіант 5 (ЛР2)
  DB_CONNECT_TIMEOUT: "3"
  DB_COMMAND_TIMEOUT: "5"
  HTTP_HOST: 0.0.0.0
  HTTP_PORT: "8000"
  HTTP_WORKERS: "1"
  DEFAULT_LIMIT: "20"
  MAX_LIMIT: "100"
  HISTOGRAM_BUCKETS_MS: "1,2,4,8,16,32,64,128,256,512,1024"   # Г3
  LOG_LEVEL: info
  ACCESS_LOG: "false"
  PYTHONUNBUFFERED: "1"
  STARTUP_DELAY_SECONDS: "0"         # Д6: 15 у прогонах з початковою ініціалізацією
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: studies
spec:
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: web
          image: studies-service:latest
          imagePullPolicy: IfNotPresent      # образ завантажено в кластер k3d image import
          envFrom:
            - configMapRef: {name: web-config}
          env:
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: db-credentials, key: DB_PASSWORD}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          ports:
            - {name: http, containerPort: 8000}
          resources:                          # варіант 5: 500m / 1
            requests: {cpu: 500m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          startupProbe:                       # Д6: до 60 с на запуск, readiness не перевіряється до успіху
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep: {seconds: 5}             # Kubernetes >= 1.30
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: studies
spec:
  type: NodePort
  selector: {app: web}
  ports:
    - {name: http, port: 8000, targetPort: http, nodePort: 30080}
